<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="VisionCraft">
  <!--
    VisionCraft: Depth. One arm of the V is on the focal plane and solid; the
    other is behind it, so it arrives as separated slices fading toward the far
    end. Depth of field drawn as geometry rather than a blur.

    One flat tile, four flat paths, one colour. No gradient, no bevel, no
    spotlight, no reticle ticks, no drop shadow: the previous mark stacked eight
    such effects and closed up into a violet smudge at 16px. Value here comes only
    from fill-opacity, which keeps the mark correct in a single ink and on white
    without a second artwork file.

    Same geometry as VisionCraftLogo.jsx, on a 48 grid scaled 8.25x. The 36x32
    mark lands dead centre: 107.5px side margins, 124px top and bottom.
  -->
  <rect width="512" height="512" rx="115" fill="#0a0a0a"/>
  <g transform="translate(58 58) scale(8.25)" fill="#00e5ff">
    <path d="M6 8L16 8L28 40L18 40Z"/>
    <path d="M32 8L42 8L38.7 16.8L28.7 16.8Z" fill-opacity="0.42"/>
    <path d="M27.8 19.2L37.8 19.2L34.5 28L24.5 28Z" fill-opacity="0.71"/>
    <path d="M23.6 30.4L33.6 30.4L30.3 39.2L20.3 39.2Z"/>
  </g>
</svg>
